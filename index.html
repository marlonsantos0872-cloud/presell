<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Histórias Únicas</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;padding:28px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%,#eef4fc 0%,#ffffff 55%,#f7f5f0 100%);
    color:#1a2535;text-align:center;-webkit-font-smoothing:antialiased;
  }
  .card{width:100%;max-width:380px}
  .logo{width:min(190px,55vw);height:auto;display:block;margin:0 auto 22px}
  h1{margin:0 0 8px;font-size:1.35rem;letter-spacing:-.01em}
  p{margin:0 0 28px;font-size:.95rem;line-height:1.5;color:#6b7a90}
  .cta{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;min-height:58px;padding:0 22px;border-radius:999px;
    background:linear-gradient(135deg,#f3b639,#e0a020);color:#2c425c;
    font-size:1rem;font-weight:800;letter-spacing:.01em;text-decoration:none;
    box-shadow:0 14px 28px -12px rgba(224,160,32,.85);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .cta:hover{transform:translateY(-1px);box-shadow:0 18px 30px -12px rgba(224,160,32,.95)}
  .cta:active{transform:translateY(0)}
  .cta:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(243,182,57,.35),0 14px 28px -12px rgba(224,160,32,.85)}
  .cta svg{width:20px;height:20px;flex:0 0 auto}
  .hint{margin-top:14px;font-size:.72rem;color:#98a3b4}
  @media (prefers-reduced-motion:reduce){.cta{transition:none}}
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/logonova.webp" alt="Histórias Únicas" width="190" fetchpriority="high">
    <h1>Ajude o Felipe Ribeiro</h1>
    <p>Um menino de 6 anos que precisa do seu apoio para vencer a dermatite atópica grave.</p>
    <a class="cta" id="cta"
       href="https://historiaunicabrasil.online/?enter=1"
       data-destination="https://historiaunicabrasil.online/?enter=1">
      Acessar o site
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg>
    </a>
    <div class="hint">Você será direcionado para o site oficial da campanha.</div>
  </main>
  <script>
  (function () {
    var cta = document.getElementById('cta');
    if (!cta) return;
    var destination = cta.getAttribute('data-destination') || 'https://historiaunicabrasil.online/?enter=1';
    var incoming = new URLSearchParams(window.location.search || '');
    if (!incoming.toString()) return;
    try {
      var url = new URL(destination);
      incoming.forEach(function (value, key) {
        if (!url.searchParams.has(key)) url.searchParams.set(key, value);
      });
      cta.href = url.toString();
    } catch (e) {
      /* Navegador muito antigo: mantem o link padrao (sem UTMs). */
    }
  })();
  </script>
</body>
</html>
